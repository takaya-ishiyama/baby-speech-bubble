<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ベビー吹き出しメーカー</title>
  <desc id="desc">赤ちゃんの写真にかわいい吹き出しを合成できるWebアプリ</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8f6875" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#fff7fa"/>
  <circle cx="80" cy="35" r="250" fill="#ffd8e3"/>
  <circle cx="1125" cy="245" r="220" fill="#dceeff"/>
  <circle cx="1110" cy="650" r="160" fill="#ffe9b8"/>
  <circle cx="80" cy="655" r="135" fill="#d8ecff"/>

  <rect x="52" y="52" width="1096" height="526" rx="46" fill="#ffffff" filter="url(#shadow)"/>

  <!-- title and description -->
  <text x="115" y="190" fill="#3b2930" font-family="system-ui, -apple-system, 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif" font-size="72" font-weight="900" letter-spacing="-4">ベビー吹き出し</text>
  <text x="115" y="280" fill="#e35f8e" font-family="system-ui, -apple-system, 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif" font-size="72" font-weight="900" letter-spacing="-4">メーカー</text>

  <text x="120" y="365" fill="#74666b" font-family="system-ui, -apple-system, 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif" font-size="29" font-weight="600">赤ちゃんの写真に、かわいいひとこと。</text>
  <text x="120" y="420" fill="#74666b" font-family="system-ui, -apple-system, 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif" font-size="29" font-weight="600">ブラウザ内で合成して、そのまま保存。</text>

  <!-- privacy badge -->
  <rect x="118" y="468" width="456" height="66" rx="33" fill="#fff0f5"/>
  <rect x="145" y="490" width="29" height="27" rx="6" fill="#d95683"/>
  <path d="M151 490v-8c0-12 18-12 18 0v8" fill="none" stroke="#d95683" stroke-width="7" stroke-linecap="round"/>
  <circle cx="159.5" cy="503" r="3.5" fill="#fff"/>
  <text x="196" y="510" fill="#c94e76" font-family="system-ui, -apple-system, 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif" font-size="25" font-weight="800">写真はサーバーへ送信しません</text>

  <!-- decorative accents -->
  <circle cx="1086" cy="112" r="20" fill="#d7eaff"/>
  <circle cx="1092" cy="236" r="24" fill="#ffe4ad"/>
  <circle cx="1065" cy="352" r="13" fill="#ffcadd"/>
  <path d="M665 316l10 20 22 3-16 15 4 22-20-10-20 10 4-22-16-15 22-3z" fill="#ffc7d8"/>
  <path d="M717 366l8 16 18 3-13 12 3 18-16-8-16 8 3-18-13-12 18-3z" fill="#cfe5ff"/>

  <!-- speech bubble, completely separated from baby -->
  <rect x="760" y="100" width="320" height="170" rx="38" fill="#ffffff" stroke="#3b2930" stroke-width="8"/>
  <path d="M876 270l26 39 28-39" fill="#ffffff" stroke="#3b2930" stroke-width="8" stroke-linejoin="round"/>
  <text x="920" y="175" text-anchor="middle" fill="#3b2930" font-family="system-ui, -apple-system, 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif" font-size="35" font-weight="900">ねむい。</text>
  <text x="920" y="225" text-anchor="middle" fill="#3b2930" font-family="system-ui, -apple-system, 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif" font-size="35" font-weight="900">でも寝ない</text>

  <!-- baby face, lower-right with safe spacing -->
  <circle cx="910" cy="445" r="118" fill="#ffd9b8" stroke="#3b2930" stroke-width="8"/>
  <circle cx="790" cy="445" r="28" fill="#ffd9b8" stroke="#3b2930" stroke-width="7"/>
  <circle cx="1030" cy="445" r="28" fill="#ffd9b8" stroke="#3b2930" stroke-width="7"/>
  <path d="M865 360c17-31 68-30 82 5-32-9-47 7-48 26" fill="none" stroke="#3b2930" stroke-width="11" stroke-linecap="round"/>
  <circle cx="864" cy="450" r="10" fill="#3b2930"/>
  <circle cx="956" cy="450" r="10" fill="#3b2930"/>
  <path d="M878 500c16 22 48 22 64 0" fill="none" stroke="#3b2930" stroke-width="8" stroke-linecap="round"/>
</svg>
