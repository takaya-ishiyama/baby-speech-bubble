<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ベビー吹き出しメーカー</title>
  <desc id="desc">赤ちゃんの写真にかわいい吹き出しを合成できるWebアプリ</desc>
  <rect width="1200" height="630" fill="#fff9fb"/>
  <circle cx="110" cy="55" r="290" fill="#ffdce6"/>
  <circle cx="1130" cy="280" r="275" fill="#dbeeff"/>
  <circle cx="930" cy="650" r="190" fill="#ffefd1"/>
  <rect x="70" y="70" width="1060" height="490" rx="52" fill="#fff" stroke="#f0d3dd" stroke-width="4"/>

  <text x="130" y="190" fill="#3b2930" font-family="system-ui, -apple-system, 'Hiragino Maru Gothic ProN', sans-serif" font-size="78" font-weight="900" letter-spacing="-4">ベビー吹き出し</text>
  <text x="130" y="285" fill="#e46f93" font-family="system-ui, -apple-system, 'Hiragino Maru Gothic ProN', sans-serif" font-size="78" font-weight="900" letter-spacing="-4">メーカー</text>
  <text x="135" y="365" fill="#78676d" font-family="system-ui, -apple-system, sans-serif" font-size="30">赤ちゃんの写真に、かわいいひとこと。</text>
  <text x="135" y="410" fill="#78676d" font-family="system-ui, -apple-system, sans-serif" font-size="30">ブラウザ内で合成して、そのまま保存できます。</text>
  <rect x="135" y="465" width="360" height="56" rx="28" fill="#fff0f5"/>
  <text x="315" y="502" text-anchor="middle" fill="#ab4c6c" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="700">写真はサーバーへ送信しません</text>

  <path d="M735 120h265a50 50 0 0 1 50 50v80a50 50 0 0 1-50 50h-80l-42 60-48-60h-95a50 50 0 0 1-50-50v-80a50 50 0 0 1 50-50Z" fill="#fff" stroke="#3b2930" stroke-width="8" stroke-linejoin="round"/>
  <text x="867" y="195" text-anchor="middle" fill="#3b2930" font-family="system-ui, -apple-system, 'Hiragino Maru Gothic ProN', sans-serif" font-size="34" font-weight="900">ねむい。</text>
  <text x="867" y="242" text-anchor="middle" fill="#3b2930" font-family="system-ui, -apple-system, 'Hiragino Maru Gothic ProN', sans-serif" font-size="34" font-weight="900">でも寝ない</text>

  <circle cx="870" cy="440" r="125" fill="#ffdabd" stroke="#3b2930" stroke-width="8"/>
  <circle cx="745" cy="438" r="28" fill="#ffdabd" stroke="#3b2930" stroke-width="7"/>
  <circle cx="995" cy="438" r="28" fill="#ffdabd" stroke="#3b2930" stroke-width="7"/>
  <path d="M830 338c17-31 70-31 86 5-34-10-50 7-51 27" fill="none" stroke="#3b2930" stroke-width="11" stroke-linecap="round"/>
  <circle cx="825" cy="435" r="10" fill="#3b2930"/>
  <circle cx="915" cy="435" r="10" fill="#3b2930"/>
  <path d="M840 475c15 23 45 23 60 0" fill="none" stroke="#3b2930" stroke-width="8" stroke-linecap="round"/>
</svg>
