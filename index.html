<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff3f6" />
    <meta name="description" content="赤ちゃんの写真に吹き出しコメントを合成して保存できるWebアプリ" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="ベビー吹き出しメーカー" />
    <meta property="og:description" content="赤ちゃんの写真に、かわいいひとことを添えて保存できるWebアプリ。写真はサーバーへ送信されません。" />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ベビー吹き出しメーカー" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ベビー吹き出しメーカー" />
    <meta name="twitter:description" content="赤ちゃんの写真に、かわいいひとことを添えて保存できるWebアプリ。" />
    <meta name="twitter:image" content="/og-image.svg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ベビー吹き出しメーカー</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">BABY SPEECH BUBBLE</p>
        <h1>ベビー吹き出し<br /><span>メーカー</span></h1>
        <p class="lead">赤ちゃんの写真に、かわいいひとことを添えて保存。写真は端末の外へ送信されません。</p>
      </header>

      <section class="panel controls" aria-label="画像編集">
        <label class="upload" id="dropZone">
          <span class="upload-icon">＋</span>
          <span><strong>赤ちゃんの写真を選ぶ</strong><small>JPEG / PNG / WebP</small></span>
          <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" />
        </label>

        <div class="caption-editor">
          <label for="captionInput">吹き出しのことば</label>
          <div class="caption-row">
            <input id="captionInput" type="text" maxlength="40" placeholder="例：ミルク、まだですか？" />
            <button id="applyButton" class="button soft" type="button" disabled>反映</button>
          </div>
          <p>空欄で反映すると、ランダムなことばに戻ります。</p>
        </div>

        <div class="actions">
          <button id="rerollButton" class="button secondary" type="button" disabled>↻ 別のことば</button>
          <button id="downloadButton" class="button primary" type="button" disabled>↓ 画像を保存</button>
        </div>
        <p class="privacy">🔒 画像処理はすべてブラウザ内で行われ、写真はサーバーへ送信されません。</p>
      </section>

      <section class="preview" aria-live="polite">
        <div id="emptyState" class="empty-state">
          <div class="baby-face">👶🏻</div>
          <p>ここに完成画像が表示されます</p>
        </div>
        <canvas id="canvas" hidden></canvas>
      </section>
    </main>
    <footer>Made for tiny people with very big opinions.</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
